<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="MVL Beta 0.5: arena 2D destructible con personaje animado, bolas de fuego y rival IA."
    />
    <meta name="theme-color" content="#75aadb" />
    <title>MVL — Beta 0.5</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="MVL Beta 0.5">
      <canvas
        id="game"
        width="1280"
        height="720"
        tabindex="0"
        aria-label="Arena jugable de MVL. Usá A y D para moverte, S para agacharte, E para disparar, Espacio para saltar y Enter para activar al rival IA."
      >
        Tu navegador necesita compatibilidad con Canvas 2D para ejecutar MVL.
      </canvas>

      <p id="loadingMessage" class="loading-message">Cargando MVL Beta 0.5…</p>
      <button id="restartButton" class="restart-button" type="button" hidden>
        REINICIAR BETA
      </button>
      <p id="gameStatus" class="sr-only" aria-live="polite"></p>
    </main>

    <script src="game.js"></script>
  </body>
</html>
